name: Deploy CAP to SAP BTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build CAP Project
        run: npx cds build --production

      - name: Install MBT
        run: npm install -g mbt

      - name: Build MTA Archive
        run: mbt build

      - name: Install CF CLI
        run: |
          curl -L "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=8" -o cf8.tgz
          tar -xzf cf8.tgz
          sudo mv cf8 /usr/local/bin/cf
          cf version

      - name: Login to Cloud Foundry
        run: |
          cf api ${{ secrets.CF_API }}
          cf auth ${{ secrets.CF_USERNAME }} ${{ secrets.CF_PASSWORD }}
          cf target -o ${{ secrets.CF_ORG }} -s ${{ secrets.CF_SPACE }}

      - name: Install MultiApps Plugin
        run: |
          cf install-plugin multiapps -f || true

      - name: Deploy MTAR
        run: |
          cf deploy mta_archives/*.mtar -f
